services:
  - type: web
    name: website-chatbot-poc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gpt-6-luna"
      - key: LLM_REASONING_EFFORT
        value: "none"
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SUPABASE_URL
        value: "https://gbosfrgostxveyanyvob.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://website-chatbot-poc.onrender.com,https://blagojche.dev"
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DEFAULT_SITE_ID
        value: "6953c855-51c0-4aea-bfa2-386892838eb1"
      - key: DAILY_MESSAGE_CAP
        value: "300"
      - key: PRICE_IN_PER_1M
        value: "0.10"
      - key: PRICE_OUT_PER_1M
        value: "0.50"
      - key: PRICE_EMBED_PER_1M
        value: "0.02"
      - key: MIN_SIMILARITY
        value: "0.25"
      - key: REWRITE_ON_MISS
        value: "true"
